<style>
  :root { --bg:#1A1A2E; --card:#252540; --card2:#22223B; --border:#2E2E50;

  * { box-sizing:border-box; margin:0; padding:0; }

  header { padding:46px 0 24px; border-bottom:1px solid var(--gold); margin-bottom:20px; }
  header .kicker { color:var(--gold); font-size:12px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:10px; }
  header h1 { color:var(--white); font-size:27px; font-weight:700; }
  header .meta { color:var(--fg3); font-size:12.5px; margin-top:12px; line-height:1.7; }
  .curtabs { display:flex; gap:10px; margin:22px 0 0; }
  .cur-btn { cursor:pointer; background:var(--card2); border:1px solid var(--border); color:var(--fg3);
             padding:12px 30px; border-radius:11px 11px 0 0; font-family:inherit; font-size:16px; font-weight:700; border-bottom:none; }
  .cur-btn .cur-sum { display:block; font-size:11px; font-weight:400; margin-top:2px; }
  .cur-btn.active { background:var(--gold); border-color:var(--gold); color:#1A1A2E; }
  .cur-btn.active .cur-sum { color:#4a3d08; }
  .cur-btn:hover:not(.active) { color:var(--gold); border-color:var(--gold); }
  .tabs { display:flex; gap:8px; padding:12px 0 0 4px; margin-bottom:6px; border-top:1px solid var(--gold); align-items:center; }
  .tab-btn { cursor:pointer; background:var(--card2); border:1px solid var(--border); color:var(--fg3);
             padding:8px 20px; border-radius:8px; font-family:inherit; font-size:13.5px; font-weight:700; }
  .tab-btn.active { background:#3a3a60; border-color:var(--gold); color:var(--white); }

    background:var(--card2); border:1px solid var(--border); color:var(--white);

    color-scheme:dark;

  .daterange input[type="date"]:hover { border-color:var(--gold); }
  .daterange button {
    cursor:pointer; background:var(--gold); border:1px solid var(--gold); color:#1A1A2E;
    padding:6px 16px; border-radius:6px; font-family:inherit; font-size:12.5px; font-weight:700;
  }
  .daterange button:hover { background:#d99e12; }
  .daterange button.reset { background:var(--card2); color:var(--fg3); border-color:var(--border); }
  .daterange button.reset:hover { color:var(--gold); border-color:var(--gold); }
  .daterange .sep { color:var(--fg3); }
  .daterange .lbl { color:var(--fg3); font-size:11.5px; margin-right:2px; }
  .tabpage { display:none; }
  .tabpage.active { display:block; }
  .curmeta { color:var(--fg3); font-size:12px; margin:8px 0 0 4px; line-height:1.7; }
  .curmeta strong { color:var(--white); font-weight:700; }
  h2 { color:var(--white); font-size:18px; font-weight:700; margin:26px 0 10px; }
  h2 small { color:var(--fg3); font-size:12px; font-weight:400; margin-left:8px; }
  .chartbox { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; overflow-x:auto; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11.5px; color:var(--fg3); }
  .legend span { display:inline-flex; align-items:center; gap:5px; cursor:pointer; padding:2px 7px; border-radius:6px; border:1px solid transparent; transition:.12s; }
  .legend span:hover { color:var(--gold); }
  .legend span.sel { border-color:var(--gold); color:var(--white); background:#161628; }
  .legend span.dim { opacity:.3; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  svg g.series { transition:opacity .18s; }
  svg g.series.dim { opacity:.09; }
  .scalenote { color:var(--gold); font-size:11.5px; margin-top:6px; display:none; }
  .scalenote.show { display:block; }
  .ranklist { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 0; max-height:640px; overflow-y:auto; }
  .rankrow { display:flex; align-items:center; gap:10px; padding:5px 16px; cursor:pointer; }
  .rankrow:hover { background:var(--card2); }
  .rankrow.sel { background:#161628; box-shadow:inset 3px 0 0 var(--gold); }
  .rankrow .rk { color:var(--fg3); width:34px; text-align:right; font-size:11.5px; flex:none; }
  .rankrow .nm { width:320px; flex:none; color:var(--white); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rankrow .barwrap { flex:1; height:14px; background:#161628; border-radius:4px; overflow:hidden; }
  .rankrow .bar { height:100%; border-radius:4px; background:linear-gradient(90deg, #F0C02D, #d99e12); }
  .rankrow .val { width:140px; flex:none; text-align:right; color:var(--fg2); font-size:12px; font-variant-numeric:tabular-nums; }
  #tooltip { position:fixed; display:none; z-index:200; background:#12121f; border:1px solid var(--gold); border-radius:9px;
             padding:12px 14px; font-size:12.5px; max-width:400px; box-shadow:0 8px 30px rgba(0,0,0,.55); pointer-events:none; }
  #tooltip .tt-title { color:var(--gold); font-weight:700; font-size:13px; margin-bottom:4px; }
  #tooltip .tt-sub { color:var(--fg2); margin-bottom:7px; }
  #tooltip .tt-items { border-top:1px solid var(--border); padding-top:7px; max-height:260px; overflow:hidden; }
  #tooltip .tt-items .lab { color:var(--fg3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
  #tooltip .tt-items div.it { color:var(--fg2); line-height:1.55; }
  #tooltip .tt-items div.it b { color:var(--white); font-weight:500; }
  footer { margin-top:50px; padding-top:14px; border-top:1px solid var(--border); color:var(--fg3); font-size:11.5px; display:flex; justify-content:space-between; }
  svg text { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; }
</style>

function fmtBig(v){
  if (v >= 1e12) return (v/1e12).toFixed(2).replace(/\.?0+$/,'') + '조';
  if (v >= 1e8)  return (v/1e8).toFixed(2).replace(/\.?0+$/,'') + '억';
  if (v >= 1e4)  return Math.round(v/1e4).toLocaleString() + '만';
  return v.toLocaleString();
}

const PALETTE = ['#F0C02D','#6db3e8','#7ed491','#ff7a5c','#c792ea','#4dd0c4','#f78fb3','#a3d977',

// ---------- 통화별 집계 (기간 필터 적용 가능) ----------
let AGG = {};
function buildAgg(fromDt, toDt) {
  // fromDt/toDt는 "YYYY-MM-DD" ISO string. null이면 전체 기간.
  AGG = {};
  for (const cur of CURRENCIES) {
    const d = DATA[cur.key];
    const filtered = d.daily.filter(r => (!fromDt || r[0] >= fromDt) && (!toDt || r[0] <= toDt));
    const days = [...new Set(filtered.map(r => r[0]))].sort();
    const pkgs = {};
    for (const [dd, p, q, a] of filtered) {
      if (!pkgs[p]) pkgs[p] = { qty: 0, amt: 0, daily: {} };
      pkgs[p].qty += q; pkgs[p].amt += a;
      pkgs[p].daily[dd] = [ (pkgs[p].daily[dd]?.[0] || 0) + q, (pkgs[p].daily[dd]?.[1] || 0) + a ];
    }
    // 판매 실적 0인 상품 제거 (기간 필터 시 발생 가능)
    for (const k of Object.keys(pkgs)) {
      if (pkgs[k].qty === 0 && pkgs[k].amt === 0) delete pkgs[k];
    }
    AGG[cur.key] = { days, pkgs, names: Object.keys(pkgs), items: d.items };
  }
}

// ---------- 요약 (탭 배지 + 상단 밴너) 클라이언트 사이드 재계산 ----------
function computeSummary(fromDt, toDt) {
  const fmtCash = (v) => v >= 1e8 ? (v/1e8).toFixed(2).replace(/\.?0+$/,'') + '억원'
                       : (v >= 1e4 ? Math.round(v/1e4).toLocaleString() + '만원'
                       : v.toLocaleString() + '원');
  const fmtDia = (v) => (v/1e8).toFixed(2).replace(/\.?0+$/,'') + '억';
  const fmtFlo = (v) => (v/1e12).toFixed(2).replace(/\.?0+$/,'') + '조';
  const period = fromDt && toDt ? `${fromDt} ~ ${toDt} 합계` : `전체 합계`;
  const out = {};
  for (const cur of CURRENCIES) {
    const a = AGG[cur.key];
    let q = 0, amt = 0;
    for (const p of a.names) { q += a.pkgs[p].qty; amt += a.pkgs[p].amt; }
    const n = a.names.length;
    if (cur.key === 'cash') {
      out.cash = {
        tab: `${q.toLocaleString()}건 · ${fmtCash(amt)} · ${n}종`,
        line: `${period} ${q.toLocaleString()}건 · ${fmtCash(amt)} · 상품 ${n}종`,
      };
    } else if (cur.key === 'dia') {
      out.dia = {
        tab: `${q.toLocaleString()}개 · ${fmtDia(amt)} 다이아 · ${n}종`,
        line: `${period} ${q.toLocaleString()}개 · ${amt.toLocaleString()} 다이아(${fmtDia(amt)}) · 상품 ${n}종`,
      };
    } else {
      out.florin = {
        tab: `${(q/1e8).toFixed(1)}억개 · ${fmtFlo(amt)} 플로린 · ${n}종`,
        line: `${period} ${q.toLocaleString()}개 · ${amt.toLocaleString()} 플로린(${fmtFlo(amt)}) · 상품 ${n}종`,
      };
    }
  }
  return out;
}

function moveTip(ev){
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tt.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}

let SERIES = {};

function buildChart(curKey, metric){
  const cur = CURRENCIES.find(c => c.key === curKey);
  const { days, pkgs, names } = AGG[curKey];
  const id = curKey + '-' + metric;
  const mount = 'chart-' + id, legendMount = 'legend-' + id, noteMount = 'note-' + id;
  const idx = metric === 'qty' ? 0 : 1;
  const fmt = metric === 'qty' ? (v => v.toLocaleString() + cur.qtyWord) : cur.fmtAmt;
  const top = names.slice().sort((a,b) => pkgs[b][metric] - pkgs[a][metric]).slice(0, 12);
  const topSet = new Set(top);
  const lines = top.map((p, i) => ({ key: p, name: p, pkg: p, color: PALETTE[i], etc: false,
                                     vals: days.map(d => pkgs[p].daily[d]?.[idx] || 0) }));
  const etcVals = days.map(d => {
    let s = 0;
    for (const p of names) { if (!topSet.has(p)) s += pkgs[p].daily[d]?.[idx] || 0; }
    return s;
  });
  lines.push({ key: '__etc__', name: '기타 (' + (names.length - top.length) + '종 합산)', pkg: null,
               color: ETC, etc: true, vals: etcVals });

  const reg = { lines, legend: new Map(), selected: null, render: null };
  SERIES[mount] = reg;

  function render(){
    const mountEl = document.getElementById(mount);
    mountEl.innerHTML = '';
    const sel = reg.selected;
    const base = sel ? lines.find(l => l.key === sel).vals : null;
    const maxV = (sel ? Math.max(...base, 1) : Math.max(...lines.map(l => Math.max(...l.vals)))) * 1.1;
    const W = 1180, H = 400, ML = 74, MB = 34, MT = 12, MR = 14;
    const xAt = di => ML + (W - ML - MR) * (days.length === 1 ? 0.5 : di / (days.length - 1));
    const yAt = v => H - MB - (H - MB - MT) * v / maxV;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', '100%');
    for (let g = 0; g <= 4; g++) {
      const yv = maxV * g / 4;
      const y = yAt(yv);
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', ML); line.setAttribute('x2', W - MR);
      line.setAttribute('y1', y); line.setAttribute('y2', y);
      line.setAttribute('stroke', '#2E2E50'); line.setAttribute('stroke-width', '1');
      svg.appendChild(line);
      const t = document.createElementNS(ns, 'text');
      t.textContent = metric === 'qty' ? fmtBig(Math.round(yv)) : cur.axisAmt(yv);
      t.setAttribute('x', ML - 8); t.setAttribute('y', y + 4);
      t.setAttribute('text-anchor', 'end'); t.setAttribute('font-size', '10.5'); t.setAttribute('fill', '#8A8AA8');
      svg.appendChild(t);
    }
    // X축: 데이터가 많으면 라벨 간격 자동 조절
    const stride = Math.max(1, Math.ceil(days.length / 30));
    days.forEach((d, di) => {
      if (di % stride !== 0 && di !== days.length - 1) return;
      const label = d.slice(5).replace('-', '/');
      const t = document.createElementNS(ns, 'text');
      t.textContent = label;
      t.setAttribute('x', xAt(di)); t.setAttribute('y', H - MB + 16);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '10'); t.setAttribute('fill', '#8A8AA8');
      svg.appendChild(t);
    });
    const defs = document.createElementNS(ns, 'defs');
    defs.innerHTML = '<clipPath id="clip-' + mount + '"><rect x="0" y="0" width="' + W + '" height="' + (H - MB + 2) + '"/></clipPath>';
    svg.appendChild(defs);
    const ordered = sel ? [...lines.filter(l => l.key !== sel), lines.find(l => l.key === sel)] : lines;
    ordered.forEach(ln => {
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'series' + (sel && ln.key !== sel ? ' dim' : ''));
      g.setAttribute('clip-path', 'url(#clip-' + mount + ')');
      const pts = ln.vals.map((v, di) => xAt(di).toFixed(1) + ',' + yAt(v).toFixed(1)).join(' ');
      const pl = document.createElementNS(ns, 'polyline');
      pl.setAttribute('points', pts);
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', ln.color);
      pl.setAttribute('stroke-width', ln.etc ? 1.6 : (sel === ln.key ? 2.8 : 2.2));
      if (ln.etc) pl.setAttribute('stroke-dasharray', '5 4');
      pl.setAttribute('stroke-linejoin', 'round');
      pl.setAttribute('opacity', '0.92');
      g.appendChild(pl);
      // 점: 데이터가 많으면(>60일) 점 생략, 호버는 range로 대체
      const drawDots = days.length <= 60;
      if (drawDots) {
        ln.vals.forEach((v, di) => {
          const c = document.createElementNS(ns, 'circle');
          c.setAttribute('cx', xAt(di)); c.setAttribute('cy', yAt(v));
          c.setAttribute('r', sel === ln.key ? 4 : 3.4);
          c.setAttribute('fill', ln.color);
          c.setAttribute('stroke', '#1A1A2E'); c.setAttribute('stroke-width', '1');
          c.addEventListener('mouseenter', ev => {
            c.setAttribute('r', 5.8);
            showTip(ev, curKey, ln.name, days[di].slice(5).replace('-','/') + ' · ' + fmt(v), ln.pkg);
          });
          c.addEventListener('mousemove', moveTip);
          c.addEventListener('mouseleave', () => { c.setAttribute('r', sel === ln.key ? 4 : 3.4); hideTip(); });
          g.appendChild(c);
        });
      }
      svg.appendChild(g);
    });
    mountEl.appendChild(svg);
    const note = document.getElementById(noteMount);
    if (sel) {
      const l = lines.find(x => x.key === sel);
      note.textContent = '⤢ 축 확대: 「' + l.name + '」 기준 (최대 ' + fmt(Math.max(...l.vals)) + ') — 다시 클릭하면 전체 스케일로 복귀';
      note.classList.add('show');
    } else {
      note.classList.remove('show');
    }
  }
  reg.render = render;
  render();

  const lg = document.getElementById(legendMount);
  lines.forEach(ln => {
    const s = document.createElement('span');
    s.innerHTML = '<i style="background:' + ln.color + '"></i>' + (ln.etc ? '기타 ' + (names.length - top.length) + '종' : ln.name);
    if (!ln.etc) {
      s.addEventListener('mouseenter', ev => showTip(ev, curKey, ln.name, '합계 ' + fmt(pkgs[ln.name][metric]) + ' · 클릭하면 이 라인 기준으로 확대', ln.pkg));
      s.addEventListener('mousemove', moveTip);
      s.addEventListener('mouseleave', hideTip);
    }
    s.addEventListener('click', () => toggleSelect(mount, ln.key));
    reg.legend.set(ln.key, s);
    lg.appendChild(s);
  });
}

function toggleSelect(mount, key){
  const reg = SERIES[mount];
  if (!reg || !reg.lines.some(l => l.key === key)) return;
  reg.selected = (reg.selected === key) ? null : key;
  reg.render();
  for (const [k, el] of reg.legend) {
    el.classList.toggle('sel', reg.selected === k);
    el.classList.toggle('dim', reg.selected !== null && k !== reg.selected);
  }
  const rankId = mount.replace('chart-', 'rank-');
  document.querySelectorAll('#' + rankId + ' .rankrow').forEach(r => {
    r.classList.toggle('sel', reg.selected !== null && r.dataset.pkg === reg.selected);
  });
}

// ---------- 순위 리스트 ----------
function buildRank(curKey, metric){
  const cur = CURRENCIES.find(c => c.key === curKey);
  const { pkgs, names } = AGG[curKey];
  const id = curKey + '-' + metric;
  const fmt = metric === 'qty' ? (v => v.toLocaleString() + cur.qtyWord) : cur.fmtAmt;
  const sorted = names.slice().sort((a,b) => pkgs[b][metric] - pkgs[a][metric]);
  const max = pkgs[sorted[0]]?.[metric] || 1;
  const box = document.getElementById('rank-' + id);
  const chartId = 'chart-' + id;
  sorted.forEach((p, i) => {
    const v = pkgs[p][metric];
    const row = document.createElement('div');
    row.className = 'rankrow';
    row.dataset.pkg = p;
    row.innerHTML = '<div class="rk">' + (i+1) + '</div><div class="nm">' + p + '</div>'
      + '<div class="barwrap"><div class="bar" style="width:' + Math.max(v / max * 100, 0.4) + '%"></div></div>'
      + '<div class="val">' + fmt(v) + '</div>';
    row.addEventListener('mouseenter', ev => showTip(ev, curKey, p,
      '판매 ' + pkgs[p].qty.toLocaleString() + cur.qtyWord + ' · 금액 ' + cur.fmtAmt(pkgs[p].amt)
      + (SERIES[chartId] && SERIES[chartId].lines.some(l => l.key === p) ? ' · 클릭하면 차트 확대 표시' : ''), p));
    row.addEventListener('mousemove', moveTip);
    row.addEventListener('mouseleave', hideTip);
    row.addEventListener('click', () => toggleSelect(chartId, p));
    box.appendChild(row);
  });
}

// ---------- 전체 리빌드 (기간 필터 변경 시 호출) ----------
function rebuild(fromDt, toDt) {
  buildAgg(fromDt, toDt);
  SUMMARY_ACTIVE = computeSummary(fromDt, toDt);
  SERIES = {};
  buildPageSkeleton();
  for (const cur of CURRENCIES) {
    if (AGG[cur.key].names.length === 0) continue;
    buildChart(cur.key, 'qty');
    buildChart(cur.key, 'amt');
    buildRank(cur.key, 'qty');
    buildRank(cur.key, 'amt');
  }
  // 통화 탭 배지 (탭당 요약 재렌더)
  document.querySelectorAll('.cur-btn').forEach(b => {
    const k = b.dataset.cur;
    const label = CURRENCIES.find(c => c.key === k).label;
    b.innerHTML = label + '<span class="cur-sum">' + SUMMARY_ACTIVE[k].tab + '</span>';
  });
  sync();
}

// ---------- 탭 전환 상태 ----------
const state = { cur: 'cash', metric: 'qty' };
const curtabsEl = document.getElementById('curtabs');
for (const cur of CURRENCIES) {
  const b = document.createElement('button');
  b.className = 'cur-btn' + (cur.key === state.cur ? ' active' : '');
  b.dataset.cur = cur.key;
  b.innerHTML = cur.label;  // 배지는 rebuild()가 채움
  b.addEventListener('click', () => { state.cur = cur.key; sync(); });
  curtabsEl.appendChild(b);
}
document.querySelectorAll('#subtabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => { state.metric = btn.dataset.metric; sync(); });
});

function sync(){
  document.querySelectorAll('.cur-btn').forEach(b => b.classList.toggle('active', b.dataset.cur === state.cur));
  document.querySelectorAll('#subtabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.metric === state.metric));
  document.querySelectorAll('.tabpage').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById('page-' + state.cur + '-' + state.metric);
  if (pg) pg.classList.add('active');
  const cur = CURRENCIES.find(c => c.key === state.cur);
  const line = SUMMARY_ACTIVE && SUMMARY_ACTIVE[state.cur] ? SUMMARY_ACTIVE[state.cur].line : '';
  document.getElementById('curmeta').innerHTML = '<strong>' + line + '</strong> · ' + cur.sub + ' · ' + cur.note;
}

// ---------- 기간 필터 UI 초기화 + 이벤트 ----------
(function initDateFilter(){
  const inpFrom = document.getElementById('dateStart');
  const inpTo = document.getElementById('dateEnd');
  const btnApply = document.getElementById('applyRange');
  const btnReset = document.getElementById('resetRange');
  inpFrom.min = PAYLOAD.start_dt; inpFrom.max = PAYLOAD.end_dt; inpFrom.value = PAYLOAD.start_dt;
  inpTo.min   = PAYLOAD.start_dt; inpTo.max   = PAYLOAD.end_dt; inpTo.value   = PAYLOAD.end_dt;
  btnApply.addEventListener('click', () => {
    let f = inpFrom.value, t = inpTo.value;
    if (!f || !t) { alert('시작일과 종료일 모두 선택해 주세요.'); return; }
    if (f > t)    { alert('시작일이 종료일보다 늦습니다.'); return; }
    rebuild(f, t);
    window.scrollTo(0, 0);
  });
  btnReset.addEventListener('click', () => {
    inpFrom.value = PAYLOAD.start_dt;
    inpTo.value   = PAYLOAD.end_dt;
    rebuild(PAYLOAD.start_dt, PAYLOAD.end_dt);
    window.scrollTo(0, 0);
  });
})();

// 최초 로드 시 전체 기간으로 렌더
rebuild(PAYLOAD.start_dt, PAYLOAD.end_dt);
</script>
